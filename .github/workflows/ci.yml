name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL as a GitHub Actions service container. Testcontainers already
    # handles Redis and Kafka entirely inside individual test classes (Phases
    # 2-5) — this service exists specifically because @SpringBootTest boots
    # Flyway against a DataSource bean before any test method (and therefore
    # before any test-declared @Container) has run.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ratelimiter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run full test suite (unit + integration)
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ratelimiter_test
          DB_USER: postgres
          DB_PASS: postgres

      - name: Build Docker image
        run: docker build -t rate-limiter:${{ github.sha }} .

      - name: Upload Surefire/Failsafe test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/